    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BookVerse",
      "url": "https://bookverse.app",
      "description": "Free online digital library for reading classic books, with PDF reader and audio support.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bookverse.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is BookVerse free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! BookVerse is completely free. Read all classic books online without any subscription or hidden fees."
          }
        },
        {
          "@type": "Question",
          "name": "What books are available on BookVerse?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer a curated collection of timeless classics including The Art of War, Meditations, Alice's Adventures in Wonderland, A Study in Scarlet, Pride and Prejudice, The Great Gatsby, Don Quixote, and more."
          }
        },
        {
          "@type": "Question",
          "name": "Can I upload my own PDF books?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! Use our built-in PDF Reader to upload and read any PDF document directly in your browser."
          }
        },
        {
          "@type": "Question",
          "name": "Can I listen to books instead of reading?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Our built-in audio reader converts book text to speech, allowing you to listen while you multitask."
          }
        }
      ]
    }
    </script>
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境，使用默认 dark 主题
          applyThemeToDOM("dark");
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
